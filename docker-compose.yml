services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/evshield.db
      REAL_BMS_WRITES: "false"
      OTP_MODE: "development"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in your environment}
    volumes: ["evshield-data:/data"]
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    environment: ["VITE_API_URL=http://localhost:8000/api/v1"]
    depends_on: [api]
volumes:
  evshield-data:
